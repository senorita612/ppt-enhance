[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppt-enhance"
version = "0.1.0"
description = "PDF-to-PPTX reconstruction with correction, evaluation, and speaker notes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "docling>=2.0",
    "python-pptx>=1.0",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "numpy>=1.24",
    "scikit-image>=0.22",
    "jiwer>=3.0",
    "openai>=1.0",
    "dashscope>=1.22.2",
    "opencv-python>=4.8",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ppt-enhance = "ppt_enhance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ppt_enhance"]

[tool.ruff]
line-length = 100
target-version = "py310"
